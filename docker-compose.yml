name: fiber-redundancy

services:
  api:
    build: ./api
    image: fiber-redundancy-api
    ports:
      # 宿主机端口可通过环境变量 API_PORT 配置，默认 8000
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    image: fiber-redundancy-web
    ports:
      # 宿主机端口可通过环境变量 WEB_PORT 配置，默认 8080
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 一次性验证服务：代码测试 -> 构建校验 -> API 冒烟，完成后自行退出，
  # 退出码即验证结果（0 通过 / 非 0 失败）。
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: fiber-redundancy-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web
    restart: "no"
